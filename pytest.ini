[pytest]
# Configurações do pytest para Price Tracker API

# Diretórios de testes
testpaths = tests

# Padrões de arquivos de teste
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Plugins e configurações
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes

# Marcadores customizados
markers =
    unit: Testes unitários (rápidos)
    integration: Testes de integração
    api: Testes de endpoints da API
    load: Testes de carga (lentos)
    slow: Testes lentos
    asyncio: Testes assíncronos

# Configuração do asyncio
asyncio_mode = auto

# Timeout padrão para testes (em segundos)
timeout = 30

# Ignorar warnings comuns
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Logs durante testes
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Cobertura (se pytest-cov estiver instalado)
# addopts = --cov=src --cov-report=html --cov-report=term-missing
